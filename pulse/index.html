<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1214" />
    <meta
      name="description"
      content="PULSEFIELD — 点 Play，环形舞台跟着音乐呼吸。"
    />
    <meta property="og:title" content="PULSEFIELD · HAWK" />
    <meta property="og:description" content="环形脉冲舞台 · 频谱驱动 · 点 Play 即跟拍。" />
    <meta property="og:image" content="https://Hawk327ml.github.io/thumbs/pulsefield.svg" />
    <link rel="canonical" href="https://Hawk327ml.github.io/pulse/" />
    <title>PULSEFIELD · Draft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div class="draft-banner" role="status">
      DRAFT · 本地重建中 · 验收通过前不 Featured
    </div>
    <canvas id="c"></canvas>

    <div id="hud" class="hud">
      <header class="top">
        <a class="back" href="/">← HAWK</a>
        <p class="brand">PULSEFIELD</p>
        <div class="top-right">
          <button type="button" class="ghost" id="trackBtn" aria-label="Switch track">A</button>
          <button type="button" class="ghost" id="muteBtn" aria-label="Mute">音量</button>
        </div>
      </header>

      <div class="center" id="center">
        <p class="copy" id="copy">点 Play，环形舞台跟着音乐呼吸。</p>
        <button type="button" class="play" id="playBtn">PLAY</button>
      </div>

      <div class="status" id="status" hidden>
        <p class="status-line" id="statusLine">跟随中 · Pulse A</p>
        <button type="button" class="play play-sm" id="pauseBtn">PAUSE</button>
      </div>

      <div class="meters" id="meters" hidden aria-hidden="true">
        <div class="meter"><span data-band="bass"></span><label>BASS</label></div>
        <div class="meter"><span data-band="mid"></span><label>MID</label></div>
        <div class="meter"><span data-band="high"></span><label>HIGH</label></div>
      </div>
    </div>

    <script type="module" src="/src/pulse/main.ts"></script>
  </body>
</html>
