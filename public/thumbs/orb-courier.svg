    <radialGradient id="glow" cx="70%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ff6b3d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
