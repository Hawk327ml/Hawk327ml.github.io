<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="FocusSpace preview">
  <defs>
    <linearGradient id="fs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="fs-glow" cx="72%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fs-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4895a"/>
      <stop offset="100%" stop-color="#8b5a3c"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#fs-bg)"/>
  <rect width="960" height="600" fill="url(#fs-glow)"/>

  <g opacity="0.14" stroke="#e8eef7" stroke-width="1">
    <path d="M0 120 H960 M0 240 H960 M0 360 H960 M0 480 H960"/>
    <path d="M120 0 V600 M240 0 V600 M360 0 V600 M480 0 V600 M600 0 V600 M720 0 V600 M840 0 V600"/>
  </g>

  <!-- room plane -->
  <rect x="140" y="210" width="680" height="280" rx="18" fill="#172033" stroke="#2a3a55" stroke-width="2"/>
  <rect x="160" y="360" width="640" height="110" fill="#1a2740"/>

  <!-- desk -->
  <rect x="230" y="330" width="500" height="34" rx="6" fill="url(#fs-desk)"/>
  <rect x="255" y="364" width="18" height="70" rx="3" fill="#5b4635"/>
  <rect x="687" y="364" width="18" height="70" rx="3" fill="#5b4635"/>

  <!-- lamp -->
  <circle cx="290" cy="318" r="10" fill="#334155"/>
  <rect x="286" y="260" width="8" height="58" rx="3" fill="#475569" transform="rotate(-18 290 300)"/>
  <ellipse cx="318" cy="248" rx="28" ry="16" fill="#fbbf24" opacity="0.95"/>
  <circle cx="318" cy="248" r="36" fill="#fbbf24" opacity="0.18"/>

  <!-- laptop -->
  <rect x="370" y="292" width="110" height="12" rx="3" fill="#1f2937"/>
  <rect x="378" y="238" width="94" height="58" rx="4" fill="#0f172a"/>
  <rect x="386" y="246" width="78" height="42" rx="2" fill="#60a5fa"/>

  <!-- book -->
  <rect x="510" y="304" width="88" height="16" rx="3" fill="#0f766e"/>
  <rect x="518" y="298" width="72" height="8" rx="2" fill="#f8fafc"/>

  <!-- coffee -->
  <rect x="620" y="300" width="28" height="32" rx="8" fill="#f1f5f9"/>
  <ellipse cx="634" cy="300" rx="12" ry="5" fill="#7c2d12"/>

  <!-- plant -->
  <rect x="680" y="308" width="26" height="22" rx="4" fill="#fb923c"/>
  <circle cx="693" cy="286" r="18" fill="#22c55e"/>
  <circle cx="680" cy="292" r="11" fill="#16a34a"/>
  <circle cx="706" cy="290" r="11" fill="#166534"/>

  <!-- clock hint -->
  <circle cx="760" cy="250" r="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
  <path d="M760 250 L760 236 M760 250 L772 254" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <text x="56" y="78" fill="#e8eef7" font-family="Arial Black, Helvetica, sans-serif" font-size="40" letter-spacing="3">FOCUSSPACE</text>
  <text x="56" y="112" fill="#3b82f6" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" font-weight="700">3D STUDY ROOM · R3F</text>
</svg>
