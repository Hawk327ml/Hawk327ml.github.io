    <meta property="og:title" content="SHADER LAB · HAWK" />

      property="og:description"
      content="点开即玩的片元着色器实验台：uv · time · mouse · SDF · noise。"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

  <body>
    <canvas id="c" aria-label="Shader lab canvas"></canvas>

    <div class="hud">
      <header class="top">
        <a class="back" href="/">← HAWK</a>
        <p class="brand-mini">FRAGMENT STAGE</p>
        <a class="docs" href="./GATE.md">GATE</a>
      </header>

      <div class="hero">
        <h1 class="hero-brand">SHADER LAB</h1>
        <p class="copy">拖鼠标改场 · 数字键 1–3 或按钮切换 sketch</p>
      </div>

      <div class="sketches" role="tablist" aria-label="Shader sketches">
        <button type="button" class="sketch-btn is-on" data-sketch="0" role="tab" aria-selected="true">
          1 Pulse Glow
        </button>
        <button type="button" class="sketch-btn" data-sketch="1" role="tab" aria-selected="false">
          2 SDF Circle
        </button>
        <button type="button" class="sketch-btn" data-sketch="2" role="tab" aria-selected="false">
          3 Domain Warp
        </button>
      </div>

      <p class="tip" id="tip">练什么：vUv + uTime 径向呼吸</p>
    </div>

    <script type="module" src="/src/lab/main.ts"></script>
  </body>
